image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
- hut
- ruby-full
- ruby-dev
secrets:
  - 877617a4-009f-43a7-9b4c-25e921d2f61f
environment:
  repo: 1mb-club
  site: 1mb.club
  BUNDLE_PATH: vendor/bundle
submitter:
  git.sr.ht:
    enabled: true
    allow-refs:
      - refs/heads/deploy
tasks:
- jekyll-build: |
    cd $repo
    bundle install
    bundle exec jekyll build
- package-site: |
    cd $repo/_site
    tar -cvzh . > ../site.tar.gz
- deploy: |
    hut pages publish -d $site --site-config $repo/siteconfig.json $repo/site.tar.gz
- deploy-www: |
    hut pages publish -d www.$site --site-config $repo/siteconfig.json $repo/site.tar.gz